[package]
name = "pageinfo-rs"
version = "0.2.5"
edition = "2024"
description = "CLI tool that analyzes web pages and produces structured LLM-friendly output"
license = "GPL-3.0"
repository = "https://github.com/oiwn/pageinfo-rs"
homepage = "https://github.com/oiwn/pageinfo-rs"
documentation = "https://github.com/oiwn/pageinfo-rs"
readme = "README.md"
keywords = ["web", "scraper", "cli", "html", "analysis"]
categories = ["command-line-utilities", "web-programming"]
authors = ["oiwn"]
rust-version = "1.98"

[[bin]]
name = "pginf"
path = "src/main.rs"

[lib]
name = "pageinfo_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8.0"
dirs = "6.0"
dom-content-extraction = { version = "0.4", features = ["markdown"] }
futures = "0.3"
futures-util = "0.3"
psl = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
toon-format = "0.5"
url = { version = "2.5", features = ["serde"] }
wreq = { version = "0.16", features = ["charset"] }
wreq-util = "0.2"
