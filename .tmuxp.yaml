session_name: pageinfo
shell_command_before: "export RUST_LOG=info; clear"
windows:
  - window_name: code
    focus: true
    start-directory: ./
    panes:
      - shell_command:
        - hx
  - window_name: agent
    start-directory: ./
    panes:
      - shell_command:
        - crush
  - window_name: cmd1
    start-directory: ./
    panes:
      - shell_command:
        - eza -l
  - window_name: cmd2
    start-directory: ./
    panes:
      - shell_command:
        - eza -T
  - window_name: yazi
    panes:
      - shell_command:
        - yazi
